<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Código da Tecla</title>
</head>
<body>
    <Script language = "javascript">
        function tecla(){
            window.alert("Código da tecla:" + event.keyCode);
        }
        document.body.onkeydown = tecla;

    </Script>
    
</body>
</html>
