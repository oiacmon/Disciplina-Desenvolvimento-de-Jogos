<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script type="application/javascript">
      function draw() {
        var canvas = document.getElementById("arcos");
        if (canvas.getContext) {
            var ctx = canvas.getContext("2d");
            
            ctx.beginPath();
            ctx.moveTo(200,200)
            ctx.lineTo(200,300)
            ctx.arc(200, 300, 100, 90*Math.PI/180, 270*Math.PI/180, false);

            ctx.moveTo(250, 200)
            ctx.lineTo(250,300)
            ctx.arc(250, 300, 100, 90*Math.PI/180, 270*Math.PI/180, true);


            ctx.lineWidth = 2;
            ctx.strokeStyle = "orange";

            ctx.stroke();
        }
      }
    </script>
</head>
<body onload="draw();">
    <div dis>
        <canvas id="arcos" width= 1000 height=1000></canvas>
    </div>
  </body>
</html>
