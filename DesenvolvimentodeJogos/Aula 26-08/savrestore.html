<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Save e Restore</title>
</head>
<body>
    <canvas id="canvas" width="1300" height="1000"> </canvas>
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext("2d");

        ctx.fillStyle = "yellow";
          ctx.fillRect(100, 100, 200, 300);

        ctx.save();

        ctx.fillStyle = "green";
          ctx.fillRect(350, 100, 200, 300);

        ctx.save();

        ctx.fillStyle = "red";
        ctx.fillRect(600, 100, 200, 300);

        ctx.restore();
        ctx.fillRect(850, 100, 200, 300);

        ctx.restore();
        ctx.fillRect(1100, 100, 200, 300);
        

    </script>
</body>
</html>
